services:
  - type: web
    name: algoid
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python database_setup.py"
    startCommand: "streamlit run app.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STREAMLIT_SERVER_PORT
        value: "10000"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
